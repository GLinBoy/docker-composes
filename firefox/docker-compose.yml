name: firefox

services:
  firefox:
    image: linuxserver/firefox:${FIREFOX_VERSION:-latest}
    container_name: firefox
    # SERVER: Uncomment to ensure Firefox starts automatically on boot or failure
    # restart: unless-stopped
    security_opt:
      # Required by the linuxserver.io image — some browser syscalls are blocked
      # by the default Docker seccomp profile. Keep this unless you know better.
      - seccomp:unconfined
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${FIREFOX_TZ:-UTC}
      # Optional — Firefox CLI flags passed on launch (e.g. a homepage URL)
      - FIREFOX_CLI=${FIREFOX_CLI:-https://google.com}
      # SERVER: Enable HTTP Basic auth by uncommenting these and setting a strong
      #         password in .env. Without them the web UI is open to anyone on the network.
      # - CUSTOM_USER=${FIREFOX_USER}
      # - PASSWORD=${FIREFOX_PASSWORD}
    volumes:
      - firefox_config:/config
    ports:
      - "${FIREFOX_HTTP_PORT:-3000}:3000"
      - "${FIREFOX_HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    networks:
      - firefox-network
    healthcheck:
      # GUI returns HTTP 200 on both 3000 (http) and 3001 (https)
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 1G

volumes:
  firefox_config:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/firefox

networks:
  firefox-network:
    driver: bridge

name: gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-latest}
    container_name: gitlab
    environment:
      # Any gitlab.rb setting can be added here — evaluated on every container start.
      # SERVER: Set GITLAB_EXTERNAL_URL to a real, externally reachable URL (no localhost).
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-22}
        # Apply the initial root password on first boot only when one is provided
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD'] if ENV['GITLAB_ROOT_PASSWORD'] && !ENV['GITLAB_ROOT_PASSWORD'].empty?
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      # SERVER: Prefer bind mounts for easier backup control:
      # - /data/gitlab/config:/etc/gitlab
      # - /data/gitlab/logs:/var/log/gitlab
      # - /data/gitlab/data:/var/opt/gitlab
    ports:
      - "${GITLAB_HTTP_PORT:-80}:80"
      - "${GITLAB_HTTPS_PORT:-443}:443"
      - "${GITLAB_SSH_PORT:-22}:22"
    shm_size: '256m'
    networks:
      - gitlab-network
    healthcheck:
      # Liveness endpoint — returns "GitLab OK" once the web server is up
      test: ["CMD-SHELL", "curl -sf http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 8G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 4G

volumes:
  gitlab_config:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/gitlab/config
  gitlab_logs:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/gitlab/logs
  gitlab_data:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/gitlab/data

networks:
  gitlab-network:
    driver: bridge

name: komodo

# Komodo: build & deployment automation with server monitoring.
# Deploys MongoDB + Komodo Core (UI / API) + Komodo Periphery (agent).
# Docs: https://komo.do/docs

services:
  # --- MongoDB: database used by Komodo Core ---
  mongo:
    image: ${MONGO_IMAGE:-mongo:latest}
    container_name: komodo-mongo
    # SERVER: Uncomment to start MongoDB automatically on boot or failure
    # restart: unless-stopped
    # Keep memory usage low on small hosts (WiredTiger cache capped at 256 MB)
    command: --quiet --wiredTigerCacheSizeGB 0.25
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - komodo-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      # Prevent Komodo from stopping this container with StopAllContainers
      komodo.skip: "true"
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 256M

  # --- Komodo Core: web UI / API ---
  core:
    image: ${KOMODO_CORE_IMAGE:-ghcr.io/moghtech/komodo-core:latest}
    container_name: komodo-core
    # SERVER: Uncomment to start Komodo Core automatically on boot or failure
    # restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      # Store dated database backups on the host — https://komo.do/docs/setup/backup
      - ${KOMODO_BACKUPS_PATH:-/etc/komodo/backups}:/backups
      # SERVER: Store resource sync files on the server:
      # - /etc/komodo/syncs:/syncs
      # SERVER: Optionally mount a custom core.config.toml:
      # - /etc/komodo/core.config.toml:/config/config.toml
    ports:
      - "${KOMODO_PORT:-9120}:9120"
    networks:
      - komodo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9120/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      # Prevent Komodo from stopping this container with StopAllContainers
      komodo.skip: "true"
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

  # --- Komodo Periphery: agent that manages this host's containers ---
  # Deploy Periphery with this block, or as a systemd binary:
  # https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ${KOMODO_PERIPHERY_IMAGE:-ghcr.io/moghtech/komodo-periphery:latest}
    container_name: komodo-periphery
    # SERVER: Uncomment to start Periphery automatically on boot or failure
    # restart: unless-stopped
    env_file:
      - .env
    environment:
      # Authenticates the Core <-> Periphery connection (same value as KOMODO_PASSKEY)
      PERIPHERY_PASSKEYS: ${KOMODO_PASSKEY}
      TZ: ${TZ:-UTC}
    volumes:
      # Mount the host Docker socket so Periphery can manage Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Allow Periphery to see processes outside of the container
      - /proc:/proc
      # Periphery agent root directory — must match inside and outside the container
      # See https://github.com/moghtech/komodo/discussions/180 (default: /etc/komodo)
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    networks:
      - komodo-network
    # Core connects to Periphery at https://periphery:8120 (self-signed SSL).
    # Do NOT publish 8120 unless remote hosts need to reach this agent — and
    # SERVER: if you do, always keep KOMODO_PASSKEY set.
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:8120/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      # Prevent Komodo from stopping this container with StopAllContainers
      komodo.skip: "true"
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 128M

volumes:
  mongo_data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/komodo/mongo
  mongo_config:
    driver: local

networks:
  komodo-network:
    driver: bridge


# Mosquitto configuration — mounted into the container read-only.

# MQTT over TCP (default broker port)
listener 1883
protocol mqtt

# MQTT over WebSockets (maps to host port 9001)
listener 9001
protocol websockets

# Anonymous clients are allowed. SERVER: before exposing the broker beyond
# localhost, enable authentication with password_file / allow_anonymous false
# (see: mosquitto_passwd -c /mosquitto/config/passwd <user>) and update the
# healthcheck in docker-compose.yml to pass credentials.
allow_anonymous true

# Persist messages across restarts
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs` works
log_dest stdout

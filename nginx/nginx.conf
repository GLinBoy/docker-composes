# Nginx configuration for the docker-composes/nginx stack.
# Serves the ./html directory over HTTP (and optionally HTTPS).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # SERVER: Enable Gzip compression for text assets
        # gzip on;
        # gzip_types text/plain text/css application/json application/javascript;
    }

    # SERVER: To serve HTTPS, add your certificate and key below (e.g. from
    # certbot), then open port 443. Remove or adjust the HTTP server block as
    # needed (e.g. redirect HTTP to HTTPS).
    # server {
    #     listen       443 ssl;
    #     listen       [::]:443 ssl;
    #     server_name  _;

    #     ssl_certificate      /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key  /etc/nginx/certs/privkey.pem;

    #     root   /usr/share/nginx/html;
    #     index  index.html;
    # }
}

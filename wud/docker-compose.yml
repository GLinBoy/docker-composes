name: wud

services:
  wud:
    image: ${WUD_IMAGE:-getwud/wud:latest}
    container_name: wud
    # SERVER: Uncomment to start WUD automatically on boot or failure
    # restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - WUD_LOG_LEVEL=${WUD_LOG_LEVEL:-info}
    volumes:
      # Required — access to the Docker socket so WUD can watch running containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent state (ignored/dismissed updates, watch history) — include in backups
      - store_data:/store
    ports:
      - "${WUD_PORT:-3000}:3000"
    networks:
      - wud-network
    # Official docs probe the /health endpoint with curl
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

volumes:
  store_data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/wud/store

networks:
  wud-network:
    driver: bridge
name: mailrise

services:
  mailrise:
    image: yoryan/mailrise:${MAILRISE_VERSION:-latest}
    container_name: mailrise
    volumes:
      - ./mailrise.conf:/etc/mailrise.conf:ro
    ports:
      - "${MAILRISE_PORT:-8025}:8025"
    networks:
      - mailrise-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1', 8025), 5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.mailrise.rule: "HostSNI(`*`)"
      traefik.tcp.routers.mailrise.tls: "true"
      traefik.tcp.routers.mailrise.tls.certresolver: letsencrypt
      traefik.tcp.routers.mailrise.tls.domains[0].main: ${MAILRISE_DOMAIN:-}
      traefik.tcp.routers.mailrise.entrypoints: mailsecure
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 64M

networks:
  mailrise-network:
    driver: bridge

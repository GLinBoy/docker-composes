name: mysql

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:latest}
    container_name: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sandbox}
      # Optional app user — leave empty to skip creation (only root is created)
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: ${MYSQL_TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
      # SERVER: Prefer a bind mount for easier backup control:
      # - /data/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - mysql-network
    healthcheck:
      # Image ships mysqladmin — ping requires valid credentials, so the check
      # fails only when the server is truly down or unauthenticated.
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} 2>/dev/null | grep -q 'mysqld is alive' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  mysql_data:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/mysql

networks:
  mysql-network:
    driver: bridge

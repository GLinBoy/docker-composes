name: dashy

services:
  dashy:
    image: lissy93/dashy:${DASHY_VERSION:-latest}
    container_name: dashy
    # SERVER: Uncomment to ensure Dashy starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=${DASHY_TZ:-UTC}
      # SERVER: Dashy endpoints (config saving, status checks, CORS proxy) are open
      # unless auth is enabled. Uncomment and set these before exposing Dashy to any
      # untrusted network — generate the password with: openssl rand -hex 32
      # - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
      # - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
    volumes:
      - dashy_data:/app/user-data
    ports:
      - "${DASHY_PORT:-8080}:8080"
    networks:
      - dashy-network
    healthcheck:
      # Dashy ships its own Node health script — more reliable than an HTTP probe here.
      test: ["CMD", "node", "/app/services/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

volumes:
  dashy_data:
    driver: local
    # SERVER: Use a bind mount for easier backup/editing control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/dashy

networks:
  dashy-network:
    driver: bridge

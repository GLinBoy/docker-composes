name: jetty

services:
  jetty:
    image: jetty:${JETTY_VERSION:-latest}
    container_name: jetty
    # Enable the EE10 deploy module so Jetty scans $JETTY_BASE/webapps for WAR files
    # (Servlet 6.0 / Jakarta EE 10 — covers current Spring Boot WAR packaging).
    command: ["--modules=ee10-deploy"]
    # SERVER: Uncomment to start Jetty automatically on boot or failure
    # restart: unless-stopped
    environment:
      - TZ=${JETTY_TZ:-UTC}
    volumes:
      # Drop WAR files here — Jetty deploys whatever is in webapps on startup
      - ./data/webapps:/var/lib/jetty/webapps
      # Staging area for WAR files before you copy them into webapps
      - ./data/wars:/var/lib/jetty/wars
      # Optional: custom server config XMLs (e.g. JMX, connectors) referenced in commands
      - ./data/etc:/var/lib/jetty/etc
    ports:
      - "${JETTY_PORT:-8080}:8080"
    networks:
      - jetty-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"^HTTP/1.1\" <&3; exec 3>&-'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

networks:
  jetty-network:
    driver: bridge
name: duplicati

services:
  duplicati:
    image: duplicati/duplicati:${DUPLICATI_VERSION:-latest}
    container_name: duplicati
    # SERVER: Uncomment to ensure Duplicati starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      - UID=${DUPLICATI_UID:-1000}
      - GID=${DUPLICATI_GID:-1000}
      - TZ=${DUPLICATI_TZ:-UTC}
      # SERVER: Set a strong password for the web UI (uncomment to enable)
      # - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBSERVICE_PASSWORD}
      # SERVER: Set an encryption key to protect the config database (uncomment to enable)
      # - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_SETTINGS_ENCRYPTION_KEY}
      # - CLI_ARGS= # Extra Duplicati CLI options
    volumes:
      - duplicati-config:/data
      - ${DUPLICATI_BACKUP_PATH:-./backups}:/backups
      - ${DUPLICATI_SOURCE_PATH:-./source}:/source
    ports:
      - "${DUPLICATI_PORT:-8200}:8200"
    networks:
      - duplicati-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  duplicati-config:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/duplicati/config

networks:
  duplicati-network:
    driver: bridge

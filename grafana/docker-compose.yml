name: grafana

services:
  # Grafana — analytics and interactive visualization web application
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: grafana
    # SERVER: Uncomment to ensure Grafana starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      # SERVER: Set a strong admin password in .env — default is admin/admin
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=${GRAFANA_ALLOW_SIGN_UP:-false}
      - TZ=${GRAFANA_TZ:-UTC}
    volumes:
      - grafana_data:/var/lib/grafana
      # SERVER: Uncomment to mount provisioning configs:
      # - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - grafana-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  grafana_data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/grafana

networks:
  grafana-network:
    driver: bridge

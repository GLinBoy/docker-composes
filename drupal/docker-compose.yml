name: drupal

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.34}
    container_name: drupal-mysql
    # SERVER: Uncomment to ensure MySQL starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-drupal}
      - MYSQL_USER=${MYSQL_USER:-drupal}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${DRUPAL_TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

  drupal:
    image: drupal:${DRUPAL_VERSION:-11-fpm-alpine}
    container_name: drupal
    depends_on:
      mysql:
        condition: service_healthy
    # SERVER: Uncomment to ensure Drupal starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      - TZ=${DRUPAL_TZ:-UTC}
    volumes:
      - drupal-data:/var/www/html
    networks:
      - internal-network
      - external-network
    healthcheck:
      # php-fpm listens on port 9000 inside the container
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

  webserver:
    image: ${NGINX_IMAGE:-nginx:1.25.2-alpine-slim}
    container_name: drupal-webserver
    depends_on:
      drupal:
        condition: service_healthy
    # SERVER: Uncomment to ensure the webserver starts automatically on boot or failure
    # restart: unless-stopped
    volumes:
      - drupal-data:/var/www/html
      - ./data/nginx-data/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/etc/letsencrypt
    ports:
      - "${DRUPAL_PORT:-80}:80"
    networks:
      - external-network
    healthcheck:
      # The nginx alpine-slim image ships no curl, so probe the TCP port directly
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v2.6.0}
    container_name: drupal-certbot
    depends_on:
      webserver:
        condition: service_healthy
    environment:
      - TZ=${DRUPAL_TZ:-UTC}
      - CERTBOT_DOMAIN=${CERTBOT_DOMAIN:-localhost}
    volumes:
      - drupal-data:/var/www/html
      - certbot-data:/etc/letsencrypt
    # SERVER: Replace CERTBOT_EMAIL and CERTBOT_DOMAIN with real values and set
    #         CERTBOT_STAGING=false before issuing production certificates
    command: certonly --webroot --webroot-path=/var/www/html --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email ${CERTBOT_STAGING_FLAG} -d ${CERTBOT_DOMAIN}
    networks:
      - external-network
    # certbot runs once and exits; the healthcheck confirms a certificate was issued
    healthcheck:
      test: ["CMD-SHELL", "test -d /etc/letsencrypt/live/$${CERTBOT_DOMAIN} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/drupal/mysql
  drupal-data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/drupal/web
  certbot-data:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/drupal/certbot

networks:
  internal-network:
    driver: bridge
  external-network:
    driver: bridge

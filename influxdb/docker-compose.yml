name: influxdb

services:
  influxdb:
    image: ${INFLUXDB_IMAGE:-influxdb:1.12.4-alpine}
    container_name: influxdb
    environment:
      TZ: ${INFLUXDB_TZ:-UTC}
      INFLUXDB_DB: ${INFLUXDB_DB:-}
      INFLUXDB_USER: ${INFLUXDB_USER:-}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_USER_PASSWORD:-}
      INFLUXDB_ADMIN_USER: ${INFLUXDB_ADMIN_USER:-}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-}
      # SERVER: Enable auth and define admin credentials before exposing beyond localhost
      INFLUXDB_HTTP_AUTH_ENABLED: ${INFLUXDB_HTTP_AUTH_ENABLED:-false}
    volumes:
      - influxdb-data:/var/lib/influxdb
      # SERVER: Prefer a bind mount for easier backup control:
      # - /data/influxdb:/var/lib/influxdb
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    networks:
      - influxdb-network
    healthcheck:
      # The /ping endpoint is auth-free and works whether or not auth is enabled
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8086/ping || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  influxdb-data:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/influxdb

networks:
  influxdb-network:
    driver: bridge

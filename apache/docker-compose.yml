name: apache

services:
  apache:
    image: ${APACHE_IMAGE:-httpd:latest}
    container_name: apache
    # SERVER: Uncomment to ensure Apache starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      TZ: ${APACHE_TZ:-UTC}
    volumes:
      - apache-www:/usr/local/apache2/htdocs
      # SERVER: Prefer a bind mount for easier backup control:
      # - /data/apache/htdocs:/usr/local/apache2/htdocs
    ports:
      - "${APACHE_PORT:-80}:80"
    networks:
      - apache-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

volumes:
  apache-www:
    driver: local
    # SERVER: Bind mount alternative:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/apache/htdocs

networks:
  apache-network:
    driver: bridge

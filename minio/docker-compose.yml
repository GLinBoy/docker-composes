name: minio

# Settings and configurations that are common for all MinIO server instances
x-minio-common: &minio-common
  image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
  command: server --console-address ":9001"
    http://minio-0/data1 http://minio-0/data2
    http://minio-1/data1 http://minio-1/data2
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  expose:
    - "9000"
    - "9001"
  networks:
    - minio-network
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 5
    start_period: 30s
  # SERVER: Uncomment and tune resource limits before deploying to production
  # deploy:
  #   resources:
  #     limits:
  #       cpus: '2.0'
  #       memory: 2G
  #     reservations:
  #       cpus: '0.5'
  #       memory: 512M

services:
  minio-0:
    <<: *minio-common
    container_name: minio-0
    hostname: minio-0
    volumes:
      - minio0-data1:/data1
      - minio0-data2:/data2

  minio-1:
    <<: *minio-common
    container_name: minio-1
    hostname: minio-1
    volumes:
      - minio1-data1:/data1
      - minio1-data2:/data2

  nginx:
    image: ${MINIO_NGINX_IMAGE:-nginx:1.25.1-alpine}
    container_name: minio-nginx
    depends_on:
      minio-0:
        condition: service_healthy
      minio-1:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - minio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 64M

volumes:
  minio0-data1:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/minio/minio-0/data1
  minio0-data2:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/minio/minio-0/data2
  minio1-data1:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/minio/minio-1/data1
  minio1-data2:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/minio/minio-1/data2

networks:
  minio-network:
    driver: bridge

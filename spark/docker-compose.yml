name: spark

services:
  # Master — coordinates the cluster, schedules jobs, exposes the web UI
  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:latest}
    container_name: spark-master
    hostname: spark-master
    # SERVER: Uncomment to ensure the cluster starts automatically on boot or failure
    # restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      # Spark Master web UI
      - "${SPARK_UI_PORT:-8080}:8080"
      # Master RPC port — workers register and executors connect here
      - "${SPARK_MASTER_PORT:-7077}:7077"
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  # Worker — executes tasks; registers with the master over the RPC port
  spark-worker-1:
    image: ${SPARK_IMAGE:-apache/spark:latest}
    container_name: spark-worker-1
    hostname: spark-worker-1
    # SERVER: Uncomment to ensure the cluster starts automatically on boot or failure
    # restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-1
      - --memory
      - ${SPARK_WORKER_MEMORY:-1G}
      - --cores
      - ${SPARK_WORKER_CORES:-1}
    networks:
      - spark-network
    healthcheck:
      # Passes once this worker is registered with the master (UI serves /json/ on 8080)
      test: ["CMD-SHELL", "curl -sf http://spark-master:8080/json/ | grep -q spark-worker-1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  # Worker 2 — second executor node
  spark-worker-2:
    image: ${SPARK_IMAGE:-apache/spark:latest}
    container_name: spark-worker-2
    hostname: spark-worker-2
    # SERVER: Uncomment to ensure the cluster starts automatically on boot or failure
    # restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker-2
      - --memory
      - ${SPARK_WORKER_MEMORY:-1G}
      - --cores
      - ${SPARK_WORKER_CORES:-1}
    networks:
      - spark-network
    healthcheck:
      # Passes once this worker is registered with the master (UI serves /json/ on 8080)
      test: ["CMD-SHELL", "curl -sf http://spark-master:8080/json/ | grep -q spark-worker-2 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  # Submit — interactive shell for submitting jobs to the cluster
  spark-submit:
    image: ${SPARK_IMAGE:-apache/spark:latest}
    container_name: spark-submit
    hostname: spark-submit
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    networks:
      - spark-network
    healthcheck:
      # Utility container — verify it can reach the master web UI (internal port 8080)
      test: ["CMD-SHELL", "curl -sf http://spark-master:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

networks:
  spark-network:
    driver: bridge

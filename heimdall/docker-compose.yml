name: heimdall

services:
  heimdall:
    image: linuxserver/heimdall:${HEIMDALL_VERSION:-latest}
    container_name: heimdall
    # SERVER: Uncomment to ensure Heimdall starts automatically on boot or failure
    # restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${HEIMDALL_TZ:-UTC}
      # By default Heimdall blocks lookups to private/reserved IPs.
      # LOCAL: Set to true if Heimdall only serves your LAN or is behind auth.
      # SERVER: Keep false if Heimdall is exposed to the internet.
      - ALLOW_INTERNAL_REQUESTS=${ALLOW_INTERNAL_REQUESTS:-false}
    volumes:
      - heimdall_config:/config
    ports:
      - "${HEIMDALL_HTTP_PORT:-80}:80"
      - "${HEIMDALL_HTTPS_PORT:-443}:443"
    networks:
      - heimdall-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

volumes:
  heimdall_config:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/heimdall

networks:
  heimdall-network:
    driver: bridge

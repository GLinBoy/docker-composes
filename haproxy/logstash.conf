# ============================================================
# Logstash Pipeline Configuration
# SERVER: If using xpack.security.enabled=true, update the
#         output block with user/password/ssl settings.
# ============================================================

input {
  # GELF input — receives logs from Docker containers
  # (via the gelf logging driver)
  gelf {
    port => 12201
    type => "docker"
  }

  # Beats input — receives logs from Filebeat / Metricbeat
  beats {
    port => 5044
  }
}

filter {
  # Parse Docker container metadata from GELF tags
  if [type] == "docker" {
    mutate {
      add_field => { "[@metadata][target_index]" => "docker-logs-%{+YYYY.MM.dd}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][target_index]" => "beats-%{+YYYY.MM.dd}" }
    }
  }

  # Drop empty messages
  if [message] =~ /^\s*$/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "%{[@metadata][target_index]}"
    # SERVER: When xpack.security.enabled=true, uncomment below:
    # user     => "elastic"
    # password => "${ELASTIC_PASSWORD}"
    # ssl      => true
    # cacert   => "/usr/share/logstash/certs/ca.crt"
  }

  # Optional: also log to stdout for local debugging.
  # SERVER: Remove or comment out in production to reduce noise.
  stdout {
    codec => rubydebug
  }
}

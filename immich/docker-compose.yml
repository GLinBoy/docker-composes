name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-latest}
    container_name: immich-server
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Do not edit the next line — change UPLOAD_LOCATION in .env instead
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    healthcheck:
      test: ["CMD", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-latest}
    container_name: immich-machine-learning
    # SERVER: For hardware acceleration, append one of -[armnn, cuda, rocm, openvino, rknn]
    # to the image tag above (e.g. ghcr.io/immich-app/immich-machine-learning:v3.1.0-cuda)
    env_file:
      - .env
    volumes:
      - model-cache:/cache
    healthcheck:
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  redis:
    image: ${IMMICH_REDIS_IMAGE:-docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411}
    container_name: immich-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 256M
    #     reservations:
    #       cpus: '0.1'
    #       memory: 64M

  database:
    image: ${IMMICH_DATABASE_IMAGE:-ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23}
    container_name: immich-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # SERVER: Uncomment if your database is not stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line — change DB_DATA_LOCATION in .env instead
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # SERVER: Uncomment and tune resource limits before deploying to production
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

volumes:
  model-cache:
    driver: local
    # SERVER: Use a bind mount for easier backup control:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /data/immich/model-cache
